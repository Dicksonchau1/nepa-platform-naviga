# coda.aurasensehk.com → poe-coda systemd service on 127.0.0.1:8003
# Certbot:
#   certbot --nginx -d coda.aurasensehk.com --non-interactive --agree-tos \
#           --email DicksonChau@aurasensehk.com --redirect

limit_req_zone $binary_remote_addr zone=coda_api:10m rate=30r/s;

upstream coda_backend {
    server 127.0.0.1:8003;
    keepalive 16;
}

server {
    listen 80;
    server_name coda.aurasensehk.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name coda.aurasensehk.com;

    ssl_certificate     /etc/letsencrypt/live/coda.aurasensehk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coda.aurasensehk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size       16M;     # JSON briefs, no video uploads
    proxy_read_timeout         180s;    # Runway/Canva/Gamma render calls
    proxy_send_timeout         180s;
    proxy_connect_timeout      10s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        proxy_pass http://coda_backend/health;
        access_log off;
        proxy_read_timeout 5s;
    }

    location = /coda/generate {
        limit_req zone=coda_api burst=5 nodelay;
        proxy_pass http://coda_backend/coda/generate;
    }

    location /coda/ {
        limit_req zone=coda_api burst=20 nodelay;
        proxy_pass http://coda_backend/coda/;
    }

    location = / {
        limit_req zone=coda_api burst=20 nodelay;
        proxy_pass http://coda_backend/;
    }

    location = /docs         { proxy_pass http://coda_backend/docs; }
    location = /openapi.json { proxy_pass http://coda_backend/openapi.json; }

    location / {
        return 404;
    }
}
