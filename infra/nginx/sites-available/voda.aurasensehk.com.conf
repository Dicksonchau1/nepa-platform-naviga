# voda.aurasensehk.com → poe-voda Docker container on 127.0.0.1:8002
# Certbot:
#   certbot --nginx -d voda.aurasensehk.com --non-interactive --agree-tos \
#           --email DicksonChau@aurasensehk.com --redirect

limit_req_zone $binary_remote_addr zone=voda_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=voda_upload:10m rate=5r/s;

upstream voda_backend {
    server 127.0.0.1:8002;
    keepalive 16;
}

server {
    listen 80;
    server_name voda.aurasensehk.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name voda.aurasensehk.com;

    ssl_certificate     /etc/letsencrypt/live/voda.aurasensehk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voda.aurasensehk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Video uploads can be large — Poe sends up to ~200MB attachments.
    client_max_body_size       512M;
    proxy_request_buffering    off;
    proxy_read_timeout         300s;
    proxy_send_timeout         300s;
    proxy_connect_timeout      10s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host             $host;
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Health check — no rate limit, short timeout.
    location = /health {
        proxy_pass http://voda_backend/health;
        access_log off;
        proxy_read_timeout 5s;
    }

    # Diagnose endpoint — upload-bucket rate limit.
    location = /voda/diagnose {
        limit_req zone=voda_upload burst=5 nodelay;
        proxy_pass http://voda_backend/voda/diagnose;
    }

    # FCPXML export + any other /voda/* endpoints.
    location /voda/ {
        limit_req zone=voda_api burst=20 nodelay;
        proxy_pass http://voda_backend/voda/;
    }

    # Poe server-bot endpoint (root POST) — fastapi_poe protocol handler.
    # If/when you switch to main.py (fp.run bot), this path is required.
    location = / {
        limit_req zone=voda_api burst=20 nodelay;
        proxy_pass http://voda_backend/;
    }

    # Swagger + OpenAPI (useful while integrating).
    location = /docs         { proxy_pass http://voda_backend/docs; }
    location = /openapi.json { proxy_pass http://voda_backend/openapi.json; }

    # Default: 404 for anything else.
    location / {
        return 404;
    }
}
